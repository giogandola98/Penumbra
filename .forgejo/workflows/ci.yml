name: probe
on: [push]
jobs:
  probe:
    runs-on: linux-podman
    steps:
      - run: |
          for t in podman docker git node curl gcc make python3 pip3 zip unzip xz tar cppcheck dnf sudo; do printf '%s: ' $t; command -v $t || echo MISSING; done
          python3 --version; gcc --version | head -1; git --version
          echo HOME=$HOME PWD=$PWD; whoami
          curl -sI -m 20 https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi.tar.xz | head -3
          curl -sI -m 10 https://pypi.org/simple/ | head -1
          python3 -c "import docutils, pycparser" 2>&1 | tail -1
          ls /var/lib/forgejo-runner/ 2>&1; ls -d /opt/* 2>&1 | head
          dnf list --available cppcheck 2>&1 | tail -3
          env | grep -E '^(GITHUB_SERVER_URL|FORGEJO_SERVER_URL|GITHUB_REPOSITORY)='
